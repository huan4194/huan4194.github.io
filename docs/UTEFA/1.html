<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HFT 微观结构教学终端 - 山峰图版</title>
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: #11151f;
      --card-sub-bg: #181f2c;
      --border: #212b3d;
      --text: #f1f5f9;
      --text-dim: #64748b;
      --bid: #00f090;
      --bid-dim: rgba(0, 240, 144, 0.15);
      --ask: #ff3860;
      --ask-dim: rgba(255, 56, 96, 0.15);
      --accent: #00d2ff;
      --neutral: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "JetBrains Mono", monospace;
      padding: 20px;
      min-height: 100vh;
    }

    /* 顶部状态栏 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .brand h1 { font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .symbol-tag { background: #1e293b; color: var(--accent); padding: 4px 10px; border-radius: 6px; font-size: 0.9rem; border: 1px solid var(--border); }
    .status-badge { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--text-dim); }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--neutral); }
    .dot.live { background: var(--bid); box-shadow: 0 0 12px var(--bid); }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 340px 1fr 360px;
      gap: 20px;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-dim);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 模块1：红绿灯与状态 */
    .signal-light {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      border-radius: 12px;
      font-size: 1.5rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 16px;
      border: 2px solid var(--neutral);
      background: var(--card-sub-bg);
      transition: all 0.2s ease;
    }
    .signal-light.bull { border-color: var(--bid); background: var(--bid-dim); color: var(--bid); box-shadow: 0 0 20px rgba(0,240,144,0.1); }
    .signal-light.bear { border-color: var(--ask); background: var(--ask-dim); color: var(--ask); box-shadow: 0 0 20px rgba(255,56,96,0.1); }
    .signal-light.alert { border-color: var(--accent); background: rgba(0, 210, 255, 0.15); color: var(--accent); animation: pulse 1s infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    .tug-war-track { height: 24px; background: var(--ask-dim); border-radius: 12px; overflow: hidden; position: relative; margin: 16px 0 8px; border: 1px solid rgba(255,255,255,0.05); }
    .tug-war-bid { height: 100%; background: var(--bid); width: 50%; transition: width 0.1s ease-out; box-shadow: 2px 0 10px rgba(0,240,144,0.3); }
    .tug-war-mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: #fff; z-index: 2; }
    
    .metric-box { background: var(--card-sub-bg); padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border); }
    .metric-box .title { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 4px; }
    .metric-box .value { font-size: 1.8rem; font-weight: 800; font-family: "JetBrains Mono"; }

    /* 模块2：中间价差与山峰图 */
    .micro-price-box {
      background: var(--card-sub-bg);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 16px;
    }
    .mid-display { font-size: 2.2rem; font-weight: 800; font-family: "JetBrains Mono"; margin-bottom: 8px; }
    .delta-display { font-size: 1.1rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; transition: all 0.2s; }
    
    .depth-chart-box {
      flex: 1;
      width: 100%;
      min-height: 300px;
      position: relative;
      background: var(--card-sub-bg);
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    /* 模块3：图表 */
    .chart-box { flex: 1; min-height: 140px; position: relative; background: var(--card-sub-bg); border-radius: 8px; margin-top: 8px; border: 1px solid var(--border); overflow: hidden; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>微观结构与流动性监测仪</h1>
      <span class="symbol-tag">BTC/USDT</span>
    </div>
    <div class="status-badge">
      <div id="dot" class="dot"></div>
      <span id="connState">正在接入 Binance 20档 100ms 深度流...</span>
    </div>
  </header>

  <div class="dashboard-grid">
    
    <!-- 左侧：教学信号灯与多空博弈 -->
    <div class="panel">
      <div class="panel-title">系统状态 (Market Regime)</div>
      
      <div id="signalLight" class="signal-light">
        中性震荡 / 观望
      </div>

      <div class="metric-box" style="margin-top: 20px;">
        <div class="title" style="display:flex; justify-content:space-between;">
          <span>多空挂单拔河 (前5档)</span>
          <span id="bviText">0.00%</span>
        </div>
        <div class="tug-war-track">
          <div id="tugBidBar" class="tug-war-bid"></div>
          <div class="tug-war-mid"></div>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:0.8rem; font-weight:700; color:var(--text-dim);">
          <span style="color:var(--bid)">买单总厚度</span>
          <span style="color:var(--ask)">卖单总厚度</span>
        </div>
      </div>

      <div class="metric-box" style="flex: 1; display:flex; flex-direction:column; justify-content:center;">
        <div class="title">净订单流冲击 (OFI, 衰减累积)</div>
        <div id="ofiValue" class="value" style="color: #fff;">0.00</div>
        <div id="ofiDesc" style="font-size:0.8rem; color:var(--text-dim); margin-top:8px;">反映瞬时主动加撤单意愿</div>
      </div>
    </div>

    <!-- 中间：微观价差 & LOB 山峰图 -->
    <div class="panel">
      <div class="panel-title">
        <span>LOB 累积深度 (20档流动性)</span>
        <span style="color:var(--text-dim); font-size:0.8rem;">X: 价格 | Y: 累积量</span>
      </div>

      <div class="micro-price-box">
        <div style="font-size:0.8rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px;">中间价 (Mid-Price)</div>
        <div id="midPrice" class="mid-display">0.00</div>
        
        <div style="display:flex; justify-content:center; align-items:center; gap:10px;">
          <span style="font-size:0.85rem; color:var(--text-dim);">前5档微观偏移量 Δ :</span>
          <div id="microDelta" class="delta-display" style="background:var(--neutral); color:#fff;">
            - 0.00
          </div>
        </div>
      </div>

      <div class="depth-chart-box">
        <canvas id="depthChart"></canvas>
      </div>
    </div>

    <!-- 右侧：教学图表 -->
    <div class="panel">
      <div class="panel-title">订单流方向 (OFI) 轨迹</div>
      <div class="chart-box">
        <canvas id="ofiChart"></canvas>
      </div>

      <div class="panel-title" style="margin-top:20px;">价差扩张 (Spread & Risk)</div>
      <div class="chart-box">
        <canvas id="spreadChart"></canvas>
      </div>
      <div style="font-size:0.75rem; color:var(--text-dim); text-align:center; margin-top:8px;">
        红色虚线: 流动性安全阈值线
      </div>
    </div>

  </div>

  <script>
    class MicrostructureAnalyzer {
      constructor() {
        this.prevSnapshot = null;
        this.spreadHistory = [];
      }

      update(bids, asks) {
        // 微观计算依然只取前5档，确保敏感度
        const top5Bids = bids.slice(0, 5);
        const top5Asks = asks.slice(0, 5);
        
        const [bestBP, bestBQ] = bids[0];
        const [bestAP, bestAQ] = asks[0];
        const mid = (bestAP + bestBP) / 2.0;
        const spread = bestAP - bestBP;
        
        // 微观价基于最内层盘口
        const micro = (bestBQ * bestAP + bestAQ * bestBP) / (bestBQ + bestAQ); 
        const microDelta = micro - mid;

        let ofi = 0;
        if (this.prevSnapshot) {
          const [prevBP, prevBQ] = this.prevSnapshot.bids[0];
          const [prevAP, prevAQ] = this.prevSnapshot.asks[0];
          let dBid = bestBP > prevBP ? bestBQ : (bestBP === prevBP ? bestBQ - prevBQ : -prevBQ);
          let dAsk = bestAP < prevAP ? bestAQ : (bestAP === prevAP ? bestAQ - prevAQ : -prevAQ);
          ofi = dBid - dAsk;
        }

        const bidVol5 = top5Bids.reduce((s, i) => s + i[1], 0);
        const askVol5 = top5Asks.reduce((s, i) => s + i[1], 0);
        const bvi = (bidVol5 - askVol5) / (bidVol5 + askVol5);

        this.spreadHistory.push(spread);
        if (this.spreadHistory.length > 50) this.spreadHistory.shift();

        const meanS = this.spreadHistory.reduce((a, b) => a + b, 0) / this.spreadHistory.length;
        const stdS = Math.sqrt(this.spreadHistory.reduce((s, v) => s + Math.pow(v - meanS, 2), 0) / this.spreadHistory.length) || 0;
        const riskBound = meanS + 2 * stdS;
        const isAlert = spread > riskBound && stdS > 0;

        this.prevSnapshot = { bids, asks };

        return { mid, microDelta, spread, ofi, bvi, bidVol5, askVol5, isAlert, riskBound };
      }
    }

    const analyzer = new MicrostructureAnalyzer();
    let ofiAccumulator = 0; 
    let ofiData = Array(50).fill(0);
    let spreadData = Array(50).fill(0);
    let boundData = Array(50).fill(0);

    const cvsOFI = document.getElementById('ofiChart');
    const cvsSpread = document.getElementById('spreadChart');
    const cvsDepth = document.getElementById('depthChart');
    const ctxO = cvsOFI.getContext('2d');
    const ctxS = cvsSpread.getContext('2d');
    const ctxD = cvsDepth.getContext('2d');

    function resize() {
      [cvsOFI, cvsSpread, cvsDepth].forEach(c => {
        c.width = c.parentElement.clientWidth;
        c.height = c.parentElement.clientHeight;
      });
    }
    window.addEventListener('resize', resize);
    resize();

    // 绘制山峰深度图
    function drawDepthChart(bids, asks, midPrice) {
      const w = cvsDepth.width;
      const h = cvsDepth.height;
      ctxD.clearRect(0, 0, w, h);

      // 计算累积深度
      let bidCum = 0, askCum = 0;
      const bidData = bids.map(b => { bidCum += b[1]; return { p: b[0], q: bidCum }; });
      const askData = asks.map(a => { askCum += a[1]; return { p: a[0], q: askCum }; });

      const maxQ = Math.max(bidCum, askCum, 1);
      const minP = bidData[bidData.length - 1].p;
      const maxP = askData[askData.length - 1].p;
      
      // 为了让图表两端不紧贴边缘，预留一点价格空间
      const pPadding = (maxP - minP) * 0.05;
      const chartMinP = minP - pPadding;
      const chartMaxP = maxP + pPadding;

      const getX = p => ((p - chartMinP) / (chartMaxP - chartMinP)) * w;
      const getY = q => h - (q / maxQ) * (h * 0.9); // 留出顶部 10% 空间

      // 画中心虚线 (Mid Price)
      const midX = getX(midPrice);
      ctxD.beginPath();
      ctxD.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctxD.setLineDash([5, 5]);
      ctxD.moveTo(midX, 0);
      ctxD.lineTo(midX, h);
      ctxD.stroke();
      ctxD.setLineDash([]);

      // 绘制买盘 (绿山)
      // 样式：线性渐变
      let bidGrad = ctxD.createLinearGradient(0, 0, 0, h);
      bidGrad.addColorStop(0, 'rgba(0, 240, 144, 0.4)');
      bidGrad.addColorStop(1, 'rgba(0, 240, 144, 0.05)');

      ctxD.beginPath();
      ctxD.moveTo(midX, h);
      for (let i = 0; i < bidData.length; i++) {
        const x = getX(bidData[i].p);
        const y = getY(bidData[i].q);
        // Step line 平阶画法
        ctxD.lineTo(x, getY(i === 0 ? 0 : bidData[i-1].q)); 
        ctxD.lineTo(x, y);
      }
      ctxD.lineTo(getX(minP), h);
      ctxD.fillStyle = bidGrad;
      ctxD.fill();
      ctxD.strokeStyle = 'rgba(0, 240, 144, 0.8)';
      ctxD.lineWidth = 1.5;
      ctxD.stroke();

      // 绘制卖盘 (红山)
      let askGrad = ctxD.createLinearGradient(0, 0, 0, h);
      askGrad.addColorStop(0, 'rgba(255, 56, 96, 0.4)');
      askGrad.addColorStop(1, 'rgba(255, 56, 96, 0.05)');

      ctxD.beginPath();
      ctxD.moveTo(midX, h);
      for (let i = 0; i < askData.length; i++) {
        const x = getX(askData[i].p);
        const y = getY(askData[i].q);
        // Step line 平阶画法
        ctxD.lineTo(x, getY(i === 0 ? 0 : askData[i-1].q)); 
        ctxD.lineTo(x, y);
      }
      ctxD.lineTo(getX(maxP), h);
      ctxD.fillStyle = askGrad;
      ctxD.fill();
      ctxD.strokeStyle = 'rgba(255, 56, 96, 0.8)';
      ctxD.lineWidth = 1.5;
      ctxD.stroke();
      
      // 绘制极值文字提示
      ctxD.fillStyle = 'rgba(255,255,255,0.4)';
      ctxD.font = '10px "JetBrains Mono"';
      ctxD.fillText(`Max Bid Vol: ${bidCum.toFixed(1)}`, 10, 20);
      ctxD.fillText(`Max Ask Vol: ${askCum.toFixed(1)}`, w - 110, 20);
    }

    // 绘制右侧折线图
    function drawCharts() {
      const w1 = cvsOFI.width, h1 = cvsOFI.height;
      ctxO.clearRect(0, 0, w1, h1);
      const midY = h1 / 2;
      ctxO.strokeStyle = 'rgba(255,255,255,0.1)';
      ctxO.lineWidth = 2;
      ctxO.beginPath(); ctxO.moveTo(0, midY); ctxO.lineTo(w1, midY); ctxO.stroke();

      const maxOFI = Math.max(...ofiData.map(Math.abs), 1);
      const step1 = w1 / 50;
      ofiData.forEach((val, i) => {
        const barH = (val / maxOFI) * (h1 / 2 - 10);
        ctxO.fillStyle = val > 0 ? 'rgba(0,240,144,0.8)' : 'rgba(255,56,96,0.8)';
        ctxO.fillRect(i * step1, midY, step1 - 2, -barH);
      });

      const w2 = cvsSpread.width, h2 = cvsSpread.height;
      ctxS.clearRect(0, 0, w2, h2);
      const allS = [...spreadData, ...boundData];
      const maxS = Math.max(...allS, 1);
      const getY = v => h2 - 10 - (v / maxS) * (h2 - 20);
      const step2 = w2 / 50;

      ctxS.beginPath();
      ctxS.moveTo(0, h2);
      boundData.forEach((v, i) => ctxS.lineTo(i * step2, getY(v)));
      ctxS.lineTo(w2, h2);
      ctxS.fillStyle = 'rgba(255, 56, 96, 0.05)';
      ctxS.fill();

      ctxS.beginPath();
      ctxS.strokeStyle = 'rgba(255, 56, 96, 0.5)';
      ctxS.setLineDash([4, 4]);
      boundData.forEach((v, i) => i === 0 ? ctxS.moveTo(0, getY(v)) : ctxS.lineTo(i * step2, getY(v)));
      ctxS.stroke();
      ctxS.setLineDash([]);

      ctxS.beginPath();
      ctxS.strokeStyle = '#00d2ff';
      ctxS.lineWidth = 2;
      spreadData.forEach((v, i) => i === 0 ? ctxS.moveTo(0, getY(v)) : ctxS.lineTo(i * step2, getY(v)));
      ctxS.stroke();
    }

    // 注意：把频道换成了 depth20，获取 20 档数据
    const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@depth20@100ms');
    ws.onopen = () => {
      document.getElementById('dot').className = 'dot live';
      document.getElementById('connState').innerText = '已接入实盘 20档 深度数据...';
    };

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      const bids = data.bids.map(x => [parseFloat(x[0]), parseFloat(x[1])]);
      const asks = data.asks.map(x => [parseFloat(x[0]), parseFloat(x[1])]);
      if (!bids.length) return;

      const res = analyzer.update(bids, asks);

      // 1. 价格与偏移量教学展示
      document.getElementById('midPrice').innerText = res.mid.toFixed(2);
      const dBox = document.getElementById('microDelta');
      const dVal = res.microDelta;
      dBox.innerText = `${dVal > 0 ? '▲' : '▼'} ${Math.abs(dVal).toFixed(2)}`;
      dBox.style.background = dVal > 0 ? 'var(--bid-dim)' : 'var(--ask-dim)';
      dBox.style.color = dVal > 0 ? 'var(--bid)' : 'var(--ask)';

      // 2. 多空拔河
      const bullPct = (res.bidVol5 / (res.bidVol5 + res.askVol5)) * 100;
      document.getElementById('tugBidBar').style.width = `${bullPct}%`;
      document.getElementById('bviText').innerText = `失衡度: ${(res.bvi * 100).toFixed(1)}%`;

      // 3. 教学红绿灯信号
      ofiAccumulator = ofiAccumulator * 0.8 + res.ofi; 
      const light = document.getElementById('signalLight');
      
      if (res.isAlert) {
        light.className = 'signal-light alert';
        light.innerText = '🚨 警报：流动性骤降 / 价差拉宽 (防守撤单)';
      } else if (bullPct > 60 && ofiAccumulator > 1) {
        light.className = 'signal-light bull';
        light.innerText = '🟢 多头强势 (适合买方吃单)';
      } else if (bullPct < 40 && ofiAccumulator < -1) {
        light.className = 'signal-light bear';
        light.innerText = '🔴 空头压制 (防范向下突破)';
      } else {
        light.className = 'signal-light';
        light.innerText = '⚪ 盘口均衡 (适合双边做市)';
      }

      const ofiEl = document.getElementById('ofiValue');
      ofiEl.innerText = (ofiAccumulator > 0 ? '+' : '') + ofiAccumulator.toFixed(2);
      ofiEl.style.color = ofiAccumulator > 0 ? 'var(--bid)' : 'var(--ask)';

      // 4. 渲染山峰图
      drawDepthChart(bids, asks, res.mid);

      // 5. 更新图表数据
      ofiData.shift(); ofiData.push(ofiAccumulator);
      spreadData.shift(); spreadData.push(res.spread);
      boundData.shift(); boundData.push(res.riskBound);
      drawCharts();
    };
  </script>
</body>
</html>
